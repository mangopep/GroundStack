[project]
name = "groundstack"
version = "0.1.0"
description = "RAG Platform with knowledge graph and retrieval"
requires-python = ">=3.11.5"
dependencies = [
    # The currently deployable API uses only these runtime dependencies.
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
ingestion = [
    # PDF/Document processing
    "docling",
    "pymupdf",
    "surya-ocr",
    "pikepdf",
    
    # Database
    "psycopg[binary]",
    "psycopg-pool",
    
    # Search & Storage
    "opensearch-py",
    "minio",
    
    # LLM & AI
    "ollama",
    "langfuse>=2,<6",
    "instructor",
    "flashrank",
    
    # NLP & Security
    "presidio-analyzer",
    
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx",
    "python-dotenv",
    "redis",
    "watchdog",
    "reportlab",
    
    # Chat UI
    "chainlit",
    
]

dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest",
    "pytest-cov>=5",
    "pip-audit>=2.10,<3",
    "bandit>=1.8,<2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

