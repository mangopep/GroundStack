name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: pip-audit --requirement requirements-lock.txt --disable-pip
      - run: bandit --quiet --recursive src
      - run: ruff check .
      - run: ruff format --check src scripts tests
      - run: mypy --strict src/config/settings.py src/schemas/query.py src/schemas/response.py src/schemas/knowledge.py
      - run: node --check web/app.js
      - run: python scripts/export_openapi.py --check
      - run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=75
