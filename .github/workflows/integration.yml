name: Service integration

on:
  push:
  pull_request:
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: groundstack-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GROUNDSTACK_RUN_SERVICE_INTEGRATION: "1"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "15432"
      POSTGRES_USER: groundstack_test
      POSTGRES_PASSWORD: groundstack_test_only_password
      POSTGRES_DB: groundstack_test
      OPENSEARCH_HOST: 127.0.0.1
      OPENSEARCH_PORT: "19200"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "16379"
      MINIO_ENDPOINT: 127.0.0.1:19000
      MINIO_ACCESS_KEY: groundstack_test
      MINIO_SECRET_KEY: groundstack_test_only_password
      MINIO_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Validate isolated service Compose configuration
        run: docker compose -f docker-compose.integration.yml config --quiet
      - name: Start isolated test services
        run: docker compose -f docker-compose.integration.yml up --detach --wait --wait-timeout 240
      - name: Verify object storage is ready
        run: |
          attempt=0
          while [ "$attempt" -lt 30 ]; do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "MinIO health endpoint did not become ready" >&2
          exit 1
      - name: Run real service integration tests
        run: python -m pytest -q tests/integration
      - name: Stop and remove only this run's disposable services and volumes
        if: always()
        run: docker compose -f docker-compose.integration.yml down --volumes --remove-orphans
