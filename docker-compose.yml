services:
  postgres:
    image: apache/age:release_PG15_1.6.0
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev_2026
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U rag -d rag_platform -c 'SELECT 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: rag-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=StrongP@ssw0rd2026!
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - os_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - rag-network
    mem_limit: 1g
    mem_reservation: 512m

  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  minio:
    image: minio/minio:latest
    container_name: rag-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag-network

  langfuse:
    image: langfuse/langfuse:2
    container_name: rag-langfuse
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:rag_dev_2026@postgres:5432/rag_platform
      NEXTAUTH_SECRET: changeme-super-secret-key-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      SALT: changeme-super-secret-salt-change-in-production
    ports:
      - "3000:3000"
    networks:
      - rag-network
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge

volumes:
  pg_data:
    name: rag_pg_data
  os_data:
    name: rag_os_data
  minio_data:
    name: rag_minio_data
  redis_data:
    name: rag_redis_data

